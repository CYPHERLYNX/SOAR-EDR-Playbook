# Lazagne credential-access detection rule (LimaCharlie D&R format)
# Detects execution or presence of the Lazagne password-recovery tool on Windows endpoints.
# MITRE ATT&CK: Credential Access
# See ../README.md for testing steps and the analyst triage playbook.

events:
  - NEW PROCESS
  - EXISTING PROCESS
op: and
rules:
  - op: is
    platform: windows
  - op: or
    rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: lazagne.exe
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: .\lazagne
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: lazagne
      - case sensitive: false
        op: is
        path: event/HASH
        value: '467e4f9f1795c1b08245ae621c59cdf6df630ef1631dc0859da9a82285a846'

respond:
  - action: report
    metadata:
      author: my edr
      description: Detects Lazagne (SOAR EDR Tool)
      from_view: false
      falsepositives:
        - Unlikely
      level: medium
      tags:
        - attack.credential_access
      name: myydfir-hacktool-lazagne (kiko)
